<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job agent</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#e2e6ec;--accent:#1f4e8c;--ok:#1a7f4b;--warn:#b25e09;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--ink:#e6eaf0;--mute:#98a3b3;--line:#2b3542;--accent:#7fb0ee;--ok:#5fd093;--warn:#f0b35e;--bad:#f28b82}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
header h1{font-size:16px;margin:0 0 8px}nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:5px 10px;border-radius:6px;color:var(--mute);text-decoration:none}nav a.on{background:var(--accent);color:#fff}
main{padding:16px;max-width:1200px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:13px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}a{color:var(--accent)}.mute{color:var(--mute)}.small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad)}
textarea{width:100%}form.inline{display:inline}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat b{display:block;font-size:20px}.msg{background:var(--card);border-left:4px solid var(--accent);padding:8px 12px;margin-bottom:12px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px}
</style></head><body>{% block body %}{% endblock %}</body></html>
